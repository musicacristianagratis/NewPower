<html lang="es" style="--g: 1;"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Power - Xatframe</title>
  <link rel="icon" type="image/png" sizes="16x16" href="https://musicacristianagratis.github.io/NewPower/images/newfavicon.png">
  <link rel="shortcut icon" type="image/png" href="https://musicacristianagratis.github.io/NewPower/images/newfavicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* Aplica la apariencia guardada antes del primer render (evita parpadeo) */
    try {
      var _a = JSON.parse(localStorage.getItem('xatframe-appearance') || 'null');
      if (_a) {
        if (_a.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        if (_a.glass) document.documentElement.style.setProperty('--g', String(_a.glass / 100));
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    .animate-pulse-slow {
      animation: pulse-slow 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Contenedor estricto para el sprite */
    .sprite-container {
        width: 80px;
        height: 80px;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Imagen (sin animación para evitar parpadeo) */
    .sprite-image {
        height: 100%;
        width: auto;
        position: absolute;
        left: 0;
        top: 0;
        object-fit: contain;
    }

    /* --- AJUSTES VISUALES EXCLUSIVOS PARA PAWNS (Galería libre) --- */
    #pawns-grid > div {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
    }
    
    #pawns-grid > div:hover {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
    }

    #pawns-grid > div > span:first-of-type {
        display: none !important;
    }

    #pawns-grid .sprite-container {
        background: transparent !important;
        box-shadow: none !important;
        width: auto !important;
        height: auto !important;
        overflow: visible !important;
    }

    #pawns-grid .sprite-image {
        position: static !important;
        width: auto !important;
        height: auto !important;
        max-width: none !important;
        object-fit: none !important;
        image-rendering: auto; 
    }

    /* Ocultar barra de desplazamiento para overflow seguro del buscador horizontal */
    .search-scroll::-webkit-scrollbar {
        height: 4px;
    }
    .search-scroll::-webkit-scrollbar-track {
        background: transparent; 
    }
    .search-scroll::-webkit-scrollbar-thumb {
        background: rgba(59, 130, 246, 0.5); 
        border-radius: 10px;
    }

    /* Evitar la selección de texto en todo el documento */
    * {
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 and IE 11 */
        user-select: none; /* Standard syntax */
    }

    /* =====================================================================
       SISTEMA DE ESTILO (navy / azul activo / dorado)
       Solo CSS: los selectores se apoyan en ids y en las clases que el JS
       ya intercambia (bg-blue-600, bg-slate-700, bg-emerald-900/40).
       --g  = intensidad del efecto Glass (1 = apariencia original).
       ===================================================================== */
    :root {
        --g: 1;

        /* Botones */
        --btn-navy-top: #23218a;
        --btn-navy-bot: #17165f;
        --btn-navy-line: rgba(124, 134, 255, 0.20);
        --btn-blue-top: #2d52c4;
        --btn-blue-bot: #1b3484;
        --btn-blue-line: rgba(140, 175, 255, 0.50);
        --btn-gold-top: #ffdc62;
        --btn-gold-bot: #e0a41e;
        --btn-gold-ink: #3b2a00;
        --btn-slate-bg: #26265a;
        --btn-slate-ink: #a3a3cc;
        --btn-ink: #ffffff;

        /* Superficies glass (r, g, b) */
        --pnl-top: 23, 22, 106;
        --pnl-bot: 12, 11, 61;
        --hd-top: 28, 27, 110;
        --hd-bot: 14, 13, 66;
        --card-top: 34, 33, 130;
        --card-bot: 15, 14, 70;
        --strip: 40, 40, 140;
        --th-bg: 8, 8, 46;
        --pnl-line: rgba(124, 134, 255, 0.18);
        --deep: #08082e;
        --row-hover: rgba(70, 80, 220, 0.12);

        /* Texto */
        --txt-main: #ffffff;
        --txt-soft: #c9caff;
        --txt-muted: #9a9bd6;
        --txt-input: #dcdcff;
        --txt-ph: #7f80b8;

        /* Pestañas Smilies (amarillo) / Pawns (verde) inactivas */
        --tab-y-ink: #ecd27a;
        --tab-y-hover: #ffe48a;
        --tab-g-ink: #6fdcae;
        --tab-g-hover: #8ff0c6;

        /* Sombras y brillos */
        --shadow-pnl: 0 22px 30px -22px rgba(2, 2, 28, 0.85), 0 6px 14px -8px rgba(2, 2, 28, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        --shadow-bar: 0 10px 16px -10px rgba(5, 5, 40, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        --shadow-card: 0 8px 14px -8px rgba(3, 3, 30, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --icon-glow: drop-shadow(0 0 6px rgba(140, 150, 255, 0.35));
    }

    /* ----- TEMA CLARO ----- */
    html[data-theme="light"] {
        --btn-navy-top: #eef0ff;
        --btn-navy-bot: #d6dbfb;
        --btn-navy-line: rgba(60, 72, 170, 0.30);
        --btn-slate-bg: #dde1f7;
        --btn-slate-ink: #4a4d92;
        --btn-ink: #1e2268;

        --pnl-top: 246, 247, 255;
        --pnl-bot: 228, 232, 251;
        --hd-top: 244, 246, 255;
        --hd-bot: 226, 230, 250;
        --card-top: 252, 252, 255;
        --card-bot: 232, 236, 252;
        --strip: 200, 208, 245;
        --th-bg: 214, 220, 248;
        --pnl-line: rgba(60, 72, 170, 0.22);
        --deep: #dfe4fa;
        --row-hover: rgba(70, 80, 220, 0.08);

        --txt-main: #161a52;
        --txt-soft: #3a3d88;
        --txt-muted: #5a5da6;
        --txt-input: #1b1f5c;
        --txt-ph: #7a7db8;

        --tab-y-ink: #8a6500;
        --tab-y-hover: #6b4d00;
        --tab-g-ink: #0d7a4d;
        --tab-g-hover: #085c39;

        --shadow-pnl: 0 22px 30px -22px rgba(40, 50, 140, 0.55), 0 6px 14px -8px rgba(40, 50, 140, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.7);
        --shadow-bar: 0 10px 16px -10px rgba(40, 50, 140, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.7);
        --shadow-card: 0 8px 14px -8px rgba(40, 50, 140, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.7);
        --icon-glow: drop-shadow(0 1px 3px rgba(30, 40, 120, 0.35));
    }
    html[data-theme="light"] body { color: var(--txt-main); }

    /* =====================================================================
       BOTONES
       ===================================================================== */
    #top-btn-smilies, #top-btn-pawns, #top-btn-toggle, #top-btn-lang, #top-btn-appearance,
    header button[onclick^="window.prevPage"],
    header button[onclick^="window.nextPage"],
    #search-results-container > button {
        font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: transform .15s ease, filter .15s ease, box-shadow .2s ease, background .2s ease, color .2s ease, border-color .2s ease;
    }
    #top-btn-smilies:active, #top-btn-pawns:active, #top-btn-toggle:active, #top-btn-lang:active, #top-btn-appearance:active,
    header button[onclick^="window.prevPage"]:active,
    header button[onclick^="window.nextPage"]:active,
    #search-results-container > button:active {
        transform: translateY(1px) scale(0.98);
    }

    /* --- Pestañas: SMILIES amarillo / PAWNS verde --- */
    #top-btn-smilies, #top-btn-pawns {
        border-radius: 9px;
        font-weight: 600;
    }
    #top-btn-smilies.bg-blue-600 {
        background: linear-gradient(180deg, #f6d65a, #d8a81f);
        border: 1px solid rgba(255, 226, 120, 0.65);
        color: #3b2a00;
        box-shadow: 0 0 14px rgba(255, 200, 60, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }
    #top-btn-pawns.bg-blue-600 {
        background: linear-gradient(180deg, #46d493, #1f9a66);
        border: 1px solid rgba(130, 240, 190, 0.55);
        color: #04281a;
        box-shadow: 0 0 14px rgba(52, 211, 153, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    #top-btn-smilies.bg-transparent {
        background: rgba(255, 214, 90, 0.07);
        border: 1px solid rgba(255, 214, 90, 0.22);
        color: var(--tab-y-ink);
        box-shadow: none;
    }
    #top-btn-smilies.bg-transparent:hover {
        background: rgba(255, 214, 90, 0.16);
        color: var(--tab-y-hover);
    }
    #top-btn-pawns.bg-transparent {
        background: rgba(52, 211, 153, 0.07);
        border: 1px solid rgba(52, 211, 153, 0.22);
        color: var(--tab-g-ink);
        box-shadow: none;
    }
    #top-btn-pawns.bg-transparent:hover {
        background: rgba(52, 211, 153, 0.16);
        color: var(--tab-g-hover);
    }

    /* --- Paginación (flechas) --- */
    header button[onclick^="window.prevPage"],
    header button[onclick^="window.nextPage"] {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: linear-gradient(180deg, var(--btn-navy-top), var(--btn-navy-bot));
        border: 1px solid var(--btn-navy-line);
        color: var(--txt-soft);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }
    header button[onclick^="window.prevPage"]:hover,
    header button[onclick^="window.nextPage"]:hover {
        filter: brightness(1.25);
        color: var(--btn-ink);
    }

    /* --- Ocultar/Mostrar (secundario -> dorado al activarse) --- */
    #top-btn-toggle {
        border-radius: 8px;
        font-weight: 600;
        background: var(--btn-slate-bg);
        border: 1px solid rgba(255, 255, 255, 0.07);
        color: var(--btn-slate-ink);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    html[data-theme="light"] #top-btn-toggle { border-color: var(--btn-navy-line); }
    #top-btn-toggle:hover {
        filter: brightness(1.25);
        color: var(--btn-ink);
    }
    #top-btn-toggle.bg-slate-700 {
        background: linear-gradient(180deg, var(--btn-gold-top), var(--btn-gold-bot));
        border: 1px solid #f3c63a;
        color: var(--btn-gold-ink);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    /* --- Idioma y Apariencia (chips navy) --- */
    #top-btn-lang, #top-btn-appearance {
        border-radius: 8px;
        font-weight: 600;
        background: linear-gradient(180deg, var(--btn-navy-top), var(--btn-navy-bot));
        border: 1px solid var(--btn-navy-line);
        color: var(--btn-ink);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    #top-btn-lang:hover, #top-btn-appearance:hover {
        filter: brightness(1.25);
        box-shadow: 0 0 12px rgba(90, 100, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    #top-btn-appearance[aria-expanded="true"] {
        background: linear-gradient(180deg, var(--btn-blue-top), var(--btn-blue-bot));
        border-color: var(--btn-blue-line);
        color: #fff;
        box-shadow: 0 0 14px rgba(70, 110, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    /* --- Chips de resultados del buscador --- */
    #search-results-container > button {
        border-radius: 8px;
        background: linear-gradient(180deg, var(--btn-navy-top), var(--btn-navy-bot));
        border: 1px solid var(--btn-navy-line);
        color: var(--btn-ink);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
        font-weight: 600;
    }
    /* El contenedor tiene overflow-x:auto, así que el hover no usa un halo exterior (se cortaba) */
    #search-results-container > button:hover {
        filter: brightness(1.15);
        border-color: rgba(160, 170, 255, 0.55);
        box-shadow: 0 0 0 1px rgba(160, 170, 255, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    #search-results-container > button .text-emerald-400.font-mono {
        background: linear-gradient(180deg, var(--btn-gold-top), var(--btn-gold-bot));
        color: var(--btn-gold-ink);
        font-weight: 700;
        border-radius: 5px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    #search-results-container > button.bg-emerald-900\/40 {
        background: linear-gradient(180deg, #1f7a52, #145238);
        border-color: rgba(52, 211, 153, 0.6);
        box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.30);
    }

    /* =====================================================================
       SUPERFICIES GLASS (la opacidad se controla con --g)
       ===================================================================== */
    header .bg-slate-900\/80 {
        background: linear-gradient(180deg, rgba(var(--hd-top), calc(0.92 * var(--g))), rgba(var(--hd-bot), calc(0.92 * var(--g))));
        border-color: var(--pnl-line);
        box-shadow: var(--shadow-bar);
        -webkit-backdrop-filter: blur(calc(4px + (1 - var(--g)) * 12px));
        backdrop-filter: blur(calc(4px + (1 - var(--g)) * 12px));
    }
    #page-indicator {
        font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
        color: var(--txt-soft);
    }

    #top-search {
        font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
        background: linear-gradient(180deg, rgba(var(--hd-top), calc(0.95 * var(--g))), rgba(var(--hd-bot), calc(0.95 * var(--g))));
        border-color: var(--pnl-line);
        color: var(--txt-input);
        box-shadow: var(--shadow-bar);
    }
    #top-search::placeholder { color: var(--txt-ph); }
    #top-search:focus {
        background: rgb(var(--hd-top));
        border-color: rgba(140, 175, 255, 0.55);
        box-shadow: 0 0 14px rgba(70, 110, 255, 0.35);
    }
    #search-horizontal-results > span { color: var(--txt-muted); }

    #section-details, #section-smilies, #section-pawns {
        background: linear-gradient(180deg, rgba(var(--pnl-top), var(--g)), rgba(var(--pnl-bot), var(--g)));
        border-color: var(--pnl-line);
        box-shadow: var(--shadow-pnl);
        -webkit-backdrop-filter: blur(calc((1 - var(--g)) * 14px));
        backdrop-filter: blur(calc((1 - var(--g)) * 14px));
    }
    #section-details h2, #section-smilies h2, #section-pawns h2 {
        font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
        color: var(--txt-main);
    }
    #section-details > div:first-child {
        background: rgba(var(--strip), calc(0.30 * var(--g)));
        border-color: var(--pnl-line);
    }
    #section-smilies > h2, #section-pawns > h2 { border-color: var(--pnl-line); }

    /* Tabla de detalles */
    #section-details tbody.divide-y > :not([hidden]) ~ :not([hidden]) { border-color: var(--pnl-line); }
    #section-details th {
        background: rgba(var(--th-bg), calc(0.55 * var(--g)));
        color: var(--txt-muted);
        font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
    }
    #section-details tr:hover { background: var(--row-hover); }
    #section-details .inline-block.p-1 {
        background: linear-gradient(180deg, #1c1b80, #121156);
        border-color: var(--pnl-line);
    }
    html[data-theme="light"] #section-details .inline-block.p-1 {
        background: linear-gradient(180deg, #eef0ff, #d6dbfb);
    }
    #section-details .sprite-container { background: var(--deep); }
    #t-name { font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif; color: var(--txt-main); }
    #t-price {
        color: #ffd24d;
        text-shadow: 0 0 12px rgba(255, 200, 60, 0.30);
    }
    html[data-theme="light"] #t-price { color: #a86f00; text-shadow: none; }
    #t-status-badge > span {
        background: linear-gradient(180deg, #2d52c4, #1b3484);
        border-color: rgba(140, 175, 255, 0.50);
        color: #fff;
        box-shadow: 0 0 12px rgba(70, 110, 255, 0.30);
    }

    /* Iconos de los títulos */
    #section-details h2 img { filter: var(--icon-glow); }
    #section-smilies h2 img {
        filter: brightness(0) invert(1);
        opacity: 0.5;
    }
    /* En tema claro el icono de Smilies pasa a negro */
    html[data-theme="light"] #section-smilies h2 img {
        filter: brightness(0);
        opacity: 0.5;
    }
    /* Pawns: conserva su color en tema oscuro (50% de opacidad) */
    #section-pawns h2 img {
        opacity: 0.5;
    }
    /* En tema claro el icono de Pawns también pasa a negro */
    html[data-theme="light"] #section-pawns h2 img {
        filter: brightness(0);
        opacity: 0.5;
    }

    /* Tarjetas de smilies */
    #smileys-grid > div {
        background: linear-gradient(180deg, rgba(var(--card-top), calc(0.65 * var(--g))), rgba(var(--card-bot), calc(0.85 * var(--g))));
        border-color: var(--pnl-line);
        box-shadow: var(--shadow-card);
        transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }
    #smileys-grid > div:hover {
        border-color: rgba(255, 214, 80, 0.55);
        box-shadow: 0 0 14px rgba(255, 200, 60, 0.22), var(--shadow-card);
    }
    #smileys-grid > div > span:first-of-type {
        font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
        font-weight: 600;
        color: var(--txt-main);
    }
    #smileys-grid .sprite-container {
        background: var(--deep);
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    #smileys-grid .copyable-code,
    #pawns-grid .copyable-code {
        background: linear-gradient(180deg, var(--btn-navy-top), var(--btn-navy-bot));
        border-color: var(--btn-navy-line);
        color: var(--txt-input);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }
    #smileys-grid > div:hover .copyable-code,
    #pawns-grid > div:hover .copyable-code {
        background: linear-gradient(180deg, var(--btn-gold-top), var(--btn-gold-bot));
        border-color: #f3c63a;
        color: var(--btn-gold-ink);
        font-weight: 700;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    /* Carga y error */
    #loading p {
        font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
        background: linear-gradient(180deg, rgba(var(--hd-top), calc(0.9 * var(--g))), rgba(var(--hd-bot), calc(0.9 * var(--g))));
        border: 1px solid var(--pnl-line);
        color: #9fb4ff;
    }
    html[data-theme="light"] #loading p { color: #2b3fb4; }
    #error > div {
        background: linear-gradient(180deg, rgba(70, 20, 60, 0.55), rgba(30, 10, 45, 0.65));
        border-color: rgba(255, 110, 130, 0.35);
    }
    html[data-theme="light"] #error > div { background: linear-gradient(180deg, rgba(255, 225, 232, 0.9), rgba(255, 238, 242, 0.9)); }

    /* =====================================================================
       TEMA CLARO: colores de texto que Tailwind fija por clase
       ===================================================================== */
    html[data-theme="light"] #section-details .text-slate-300,
    html[data-theme="light"] #section-details .text-slate-400,
    html[data-theme="light"] #smileys-grid .text-slate-300,
    html[data-theme="light"] #section-smilies .text-slate-300 { color: var(--txt-soft); }
    html[data-theme="light"] #section-details .text-slate-500,
    html[data-theme="light"] #section-details .text-slate-500\/70,
    html[data-theme="light"] #smileys-grid .text-slate-500 { color: var(--txt-muted); }
    html[data-theme="light"] #section-details .text-white,
    html[data-theme="light"] #error .text-white { color: var(--txt-main); }
    html[data-theme="light"] #t-id { color: #2b3fb4; }
    html[data-theme="light"] #t-countdown-timer.text-amber-400 { color: #b45309; }
    html[data-theme="light"] #t-countdown-timer.text-emerald-400 { color: #047857; }
    html[data-theme="light"] #t-countdown-status { color: var(--txt-soft); }
    html[data-theme="light"] #t-store { color: var(--txt-main); }
    html[data-theme="light"] #error .text-red-300\/80 { color: #b4233f; }
    html[data-theme="light"] #search-results-container > .text-slate-500 { color: var(--txt-muted); }

    /* =====================================================================
       CORRECCIÓN DE SOMBRAS CORTADAS
       Los <aside> tenían overflow:hidden y recortaban el box-shadow de los
       paneles; la rejilla de smilies también recortaba la sombra de sus
       tarjetas. Se libera el recorte y se conserva el límite original de
       altura del panel izquierdo (408px / 0.602 de escala).
       ===================================================================== */
    #left-panel, #right-panel { overflow: visible; }
    #section-details { max-height: 677px; }
    #section-smilies > .flex-1 { overflow: visible; }

    /* =====================================================================
       PANEL DE APARIENCIA (horizontal, dentro de la franja del header)
       Se abre a la derecha del botón, a su misma altura y tamaño, para
       quedar dentro de la zona interactiva. El buscador se oculta mientras
       está abierto (clase .ap-hide, la gestiona el JS del panel).
       ===================================================================== */
    #appearance-panel {
        height: 30px;

    // --- SISTEMA DE PAGINACIÓN ---
    function updatePaginationUI() {
        const gridId = window.currentRightView === 'smilies' ? 'smileys-grid' : 'pawns-grid';
        const grid = document.getElementById(gridId);
        const cards = grid.children;
        const totalItems = cards.length;
        const totalPages = Math.max(1, Math.ceil(totalItems / ITEMS_PER_PAGE));
        
        if (window.currentPage >= totalPages) window.currentPage = totalPages - 1;
        
        const start = window.currentPage * ITEMS_PER_PAGE;
        const end = start + ITEMS_PER_PAGE;
        
        for (let i = 0; i < cards.length; i++) {
            if (i >= start && i < end) {
                cards[i].style.display = 'flex';
            } else {
                cards[i].style.display = 'none';
            }
        }
        
        document.getElementById('page-indicator').textContent = `${window.currentPage + 1}/${totalPages}`;
    }

    window.nextPage = function() {
        const gridId = window.currentRightView === 'smilies' ? 'smileys-grid' : 'pawns-grid';
        const totalItems = document.getElementById(gridId).children.length;
        const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
        if (window.currentPage < totalPages - 1) {
            window.currentPage++;
            updatePaginationUI();
        }
    };

    window.prevPage = function() {
        if (window.currentPage > 0) {
            window.currentPage--;

        resultsWrapper.classList.add('flex');
        
        const term = query.toLowerCase();
        const results = window.apiSearchData.filter(d => d.name.toLowerCase().includes(term) || d.code.toLowerCase().includes(term));
        
        if (results.length === 0) {
            resultsContainer.innerHTML = `<span class="text-xs text-slate-500 italic" data-i18n="no_matches">${i18n[currentLang].no_matches}</span>`;

                btn.onclick = () => window.topCopyCode(r.code, btn);
                resultsContainer.appendChild(btn);
            });
        }
    };

            btnElement.innerHTML = `<span class="text-emerald-400 font-bold px-2 py-0.5" data-i18n="copied">${i18n[currentLang].copied}</span>`;

            const searchInput = document.getElementById('top-search');

        } catch(e) {
            console.error(e);
        }
        document.body.removeChild(textarea);

        card.appendChild(imgContainer);
        card.appendChild(bottomSpan);
        containerElement.appendChild(card);
    }

    async function cargarCountdown() {
        try {
            const res = await fetch("https://api.xatblog.net/countdown", {
                headers: { 'accept': '*/*' }
            });
            if (!res.ok) throw new Error(`Error HTTP Countdown: ${res.status}`);
            const data = await res.json();

            if (data.code === 200) {
                rowCountdown.classList.remove('hidden'); 
                
                let apiStatus = data.status || i18n[currentLang].unknown_state;
                if (apiStatus.toLowerCase() === "will be released") {
                    tCountdownStatus.innerHTML = `<span data-i18n="time_rem">${i18n[currentLang].time_rem}</span>`;
                } else {
                    tCountdownStatus.textContent = apiStatus;
                }

                if (data.status_code === 'counting' && data.remaining_int) {
                    const targetTime = Date.now() + (parseInt(data.remaining_int, 10) * 1000);
                    
                    if (countdownInterval) clearInterval(countdownInterval);

                    const updateTimer = () => {
                        const timeLeft = Math.floor((targetTime - Date.now()) / 1000);

                        if (timeLeft <= 0) {
                            tCountdownTimer.innerHTML = `<span data-i18n="released">${i18n[currentLang].released}</span>`;
                            tCountdownTimer.classList.remove('text-amber-400');
                            tCountdownTimer.classList.add('text-emerald-400');
                            clearInterval(countdownInterval);
                            return;
                        }
                        
                        const d = Math.floor(timeLeft / (3600 * 24));
                        const h = Math.floor((timeLeft % (3600 * 24)) / 3600).toString().padStart(2, '0');
                        const m = Math.floor((timeLeft % 3600) / 60).toString().padStart(2, '0');
                        const s = Math.floor(timeLeft % 60).toString().padStart(2, '0');
                        
                        let timeString = `${h}:${m}:${s}`;
                        if (d > 0) timeString = `${d}d ` + timeString; 
                        
                        tCountdownTimer.textContent = timeString;
                    };

                    updateTimer(); 
                    countdownInterval = setInterval(updateTimer, 1000); 
                } else {
                    tCountdownTimer.textContent = "";
                }
            }
        } catch (error) {
            console.error("Error obteniendo countdown:", error);
            rowCountdown.classList.add('hidden'); 
        }
    }

    async function cargarDatos() {
        showView('loading');
        window.apiSearchData = []; 
        
        try {
            const res = await fetch("https://illuxat.com/api/latestpower");
            
            if (!res.ok) throw new Error(`Error HTTP: ${res.status}`);
            
            const json = await res.json();
            const item = json.data.latest;

                if (pawnsEntries.length > 0) {

                            validSmileyName = (item.Smileys && item.Smileys.length > 0) ? item.Smileys[0] : powerName.toLowerCase();
                        }

        } catch (error) {
            console.error("Error obteniendo datos:", error);
            showView('error');

    // --- PROTECCIÓN GLOBAL DE COPIA Y ANTI-DEVTOOLS ---
    
    // Deshabilitar el clic derecho en toda la página
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Prevenir copiado manual desde teclado, aunque permitiendo el programático si hay selección interna
    document.addEventListener('copy', function(e) {
        if (e.target.tagName === 'TEXTAREA') return; 
        
        const selection = window.getSelection();
        let isCopyable = false;
        
        if (selection.rangeCount > 0) {
            const node = selection.focusNode;
            if (node && node.parentElement && node.parentElement.classList.contains('copyable-code')) {
                isCopyable = true;
            }
        }
        
        if (!isCopyable) {
            e.preventDefault();
        }
    });

    // Bloquear atajos de teclado para herramientas de desarrollo
    document.addEventListener('keydown', function(e) {
        // F12
        if (e.key === 'F12' || e.keyCode === 123) { 
            e.preventDefault(); 
            return false; 
        }
        // Ctrl+Shift+I / J / C (Inspeccionar, Consola, Inspector de Elementos)
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) { 
            e.preventDefault(); 
            return false; 
        }
        // Ctrl+U (Ver código fuente)
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { 
            e.preventDefault(); 
            return false; 
        }

        // Ctrl+C (Copiar) excepto si es permitido
        if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
            const selection = window.getSelection();
            let isCopyable = false;
            if (selection.rangeCount > 0) {
                const node = selection.focusNode;
                if (node && node.parentElement && node.parentElement.classList.contains('copyable-code')) {
                    isCopyable = true;
                }
            }
            if (!isCopyable && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
            }
        }
    });

    // Detección de DevTools (trampa del depurador para disuadir la inspección)
    (function() {
        setInterval(function() {
            const before = new Date().getTime();
            // Esta instrucción pausa la ejecución si las herramientas de desarrollador están abiertas
            debugger;
            const after = new Date().getTime();
            // Si la pausa duró más de un tiempo razonable, asumimos que DevTools está abierto
            if (after - before > 100) {
                // Acción disuasoria: mostrar una pantalla en blanco y vaciar el body
                document.body.innerHTML = '';
                document.body.style.display = 'none';
            }
        }, 1000);
    })();

  </script>


  <script>
    // --- APARIENCIA: tema Light/Dark + opacidad del efecto Glass ---
    (function () {
        const KEY = 'xatframe-appearance';
        const root = document.documentElement;
        const panel = document.getElementById('appearance-panel');
        const btn = document.getElementById('top-btn-appearance');
        const range = document.getElementById('glass-range');
        const label = document.getElementById('glass-value');
        window.appTheme = 'dark';
        window.appGlass = 100;

        function save() {
            try { localStorage.setItem(KEY, JSON.stringify({ theme: window.appTheme, glass: window.appGlass })); } catch (e) {}
        }

        window.setTheme = function (t) {
            t = t === 'light' ? 'light' : 'dark';
            window.appTheme = t;
            if (t === 'light') root.setAttribute('data-theme', 'light'); else root.removeAttribute('data-theme');
            document.querySelectorAll('[data-theme-opt]').forEach(b => {
                const on = b.getAttribute('data-theme-opt') === t;
                b.classList.toggle('is-active', on);
                b.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            save();
        };

        window.setGlass = function (v) {
            v = Math.min(100, Math.max(25, parseInt(v, 10) || 100));
            window.appGlass = v;
            root.style.setProperty('--g', String(v / 100));
            if (range) range.value = v;
            if (label) label.textContent = v + '%';
            save();
        };

        const searchInput = document.getElementById('top-search');
        const searchWrap = searchInput ? searchInput.parentElement : null;

        function closePanel() {
            panel.classList.add('hidden');
            btn.setAttribute('aria-expanded', 'false');
            if (searchWrap) searchWrap.classList.remove('ap-hide');
        }

        window.toggleAppearance = function (e) {
            if (e) e.stopPropagation();
            const open = panel.classList.toggle('hidden') === false;
            btn.setAttribute('aria-expanded', open ? 'true' : 'false');
            if (searchWrap) searchWrap.classList.toggle('ap-hide', open);
        };

        document.addEventListener('click', closePanel);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });

        // Restaurar preferencias guardadas
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
        window.setTheme(saved && saved.theme === 'light' ? 'light' : 'dark');
        window.setGlass(saved && saved.glass ? saved.glass : 100);
    })();
  </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            /* ==========================================
               1. ESTRELLAS
               ========================================== */
            const sky = document.getElementById("sky-container");
            const numStars = 400;

            for (let i = 0; i < numStars; i++) {
                const star = document.createElement("div");
                star.classList.add("star");

                const rand = Math.random();
                if (rand < 0.70) star.classList.add("star-sm");
                else if (rand < 0.95) star.classList.add("star-md");
                else star.classList.add("star-lg");

                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;

                const duration = 2 + Math.random() * 5; 
                const delay = Math.random() * 5; 
                star.style.opacity = (Math.random() * 0.5 + 0.3).toFixed(2);
                star.style.animation = `twinkle ${duration}s ease-in-out ${delay}s infinite alternate`;

                sky.appendChild(star);
            }

            /* ==========================================
               2. COMETAS ORGÃNICOS (FÃSICAS REALES CON JS)
               ========================================== */
            const cometsLayer = document.getElementById("comets-layer");
            let activeComets = [];

            function createOrganicComet() {
                const cometEl = document.createElement("div");
                cometEl.classList.add("comet");
                cometsLayer.appendChild(cometEl);

                const startX = window.innerWidth * 0.5 + Math.random() * window.innerWidth;
                const startY = -100 - Math.random() * 200;

                const angle = (140 + Math.random() * 30) * Math.PI / 180;
                const speed = 8 + Math.random() * 12;

                const comet = {
                    el: cometEl,
                    x: startX,
                    y: startY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    gravity: 0.04 + Math.random() * 0.06, 
                    scale: 0.5 + Math.random() * 0.8,
                    life: 0,
                    maxLife: 100 + Math.random() * 120, 
                    tailBaseLength: 8 + Math.random() * 6 
                };

                activeComets.push(comet);
            }

            function animateComets() {
                for (let i = activeComets.length - 1; i >= 0; i--) {
                    const c = activeComets[i];
                    c.life++;

                    c.vy += c.gravity;
                    c.x += c.vx;
                    c.y += c.vy;

                    const currentSpeed = Math.hypot(c.vx, c.vy);
                    const tailLength = currentSpeed * c.tailBaseLength;

                    const headingAngle = Math.atan2(c.vy, c.vx) * 180 / Math.PI;
                    const tailAngle = headingAngle + 180;

                    let opacity = 1;
                    const fadeInTicks = c.maxLife * 0.15;
                    const fadeOutTicks = c.maxLife * 0.35;

                    if (c.life < fadeInTicks) {
                        opacity = c.life / fadeInTicks;
                    } else if (c.life > c.maxLife - fadeOutTicks) {
                        opacity = Math.max(0, (c.maxLife - c.life) / fadeOutTicks);
                    }

                    c.el.style.transform = `translate(${c.x}px, ${c.y}px) rotate(${tailAngle}deg) scale(${c.scale})`;
                    c.el.style.opacity = opacity.toFixed(3);
                    c.el.style.setProperty('--tail-length', `${tailLength}px`);

                    if (c.life >= c.maxLife || c.y > window.innerHeight + 200 || c.x < -200) {
                        c.el.remove();
                        activeComets.splice(i, 1);
                    }
                }
                requestAnimationFrame(animateComets);
            }

            function cometSpawner() {
                if (activeComets.length < 5 && Math.random() > 0.3) {
                    createOrganicComet();
                }
                const nextSpawn = 1200 + Math.random() * 4500;
                setTimeout(cometSpawner, nextSpawn);
            }

            requestAnimationFrame(animateComets);
            setTimeout(cometSpawner, 800);
        });
    </script>
